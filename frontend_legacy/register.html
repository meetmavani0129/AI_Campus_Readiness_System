<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Campus Readiness</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" onsubmit="handleRegister(event)">
            <h2>Register</h2>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="university">University</label>
                <input type="text" id="university" required>
            </div>
            <div class="form-group">
                <label for="degree">Degree</label>
                <select id="degree" required>
                    <option value="">Select Degree</option>
                    <option value="B.Tech">B.Tech / B.E.</option>
                    <option value="M.Tech">M.Tech / M.E.</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="year_of_study">Year of Study</label>
                <input type="number" id="year_of_study" min="1" max="5" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div id="register-error" style="color: red; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="cta-button">Register</button>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
