<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Campus Readiness System</title>
    <!-- Restore dark mode preference before React loads to prevent FOUC -->
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem('aiCampusPreferences') || '{}');
        if (prefs.darkMode) { document.documentElement.classList.add('dark'); }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
